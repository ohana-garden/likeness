version: '3.8'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:15-3.3
    container_name: volunteer_hub_db
    environment:
      POSTGRES_DB: volunteer_hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./volunteer_hub/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and message queue
  redis:
    image: redis:7-alpine
    container_name: volunteer_hub_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volunteer_hub_api
    environment:
      # Application
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # API Keys
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HUME_API_KEY: ${HUME_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}

      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: volunteer_hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: password

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      # Features
      ENABLE_VOICE: ${ENABLE_VOICE:-true}
      ENABLE_SMS_FALLBACK: ${ENABLE_SMS_FALLBACK:-true}
      ENABLE_DIGITAL_TWINS: ${ENABLE_DIGITAL_TWINS:-true}
      ENABLE_MULTI_AGENT: ${ENABLE_MULTI_AGENT:-true}

    ports:
      - "8000:8000"
    volumes:
      - ./volunteer_hub:/app/volunteer_hub
      - ./tmp:/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn volunteer_hub.web.api.endpoints:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend (optional, for development)
  frontend:
    build:
      context: ./volunteer_hub/web/frontend
      dockerfile: Dockerfile.frontend
    container_name: volunteer_hub_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./volunteer_hub/web/frontend/src:/app/src
    environment:
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
